<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600&family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@500;700&family=Cormorant+Garamond:wght@500;600&display=block" rel="stylesheet">
<!--
  リール表紙（1080×1920）
  ?theme=blue|sage|gray|rose|night  &photo=写真のパス  &kick=ラベル  &title=1行目|2行目|3行目
-->
<style>
:root{
  --top:#9AAAB6; --mid:#C9CFD3; --bot:#E9E8E4; --glow:rgba(255,255,255,.55);
  --noise:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .25  0 0 0 0 .22  0 0 0 0 .2  0 0 0 1.3 -.5'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>");
  --serif:"Shippori Mincho B1","Yu Mincho",serif;
  --sans:"Yu Gothic","YuGothic","Zen Kaku Gothic New",sans-serif;
  --en:"Cormorant Garamond",serif;
}
body[data-theme=sage]{--top:#A6B39E;--mid:#CDD3C6;--bot:#ECEBE5}
body[data-theme=gray]{--top:#8F9AA3;--mid:#B7BFC5;--bot:#D9DCDD}
body[data-theme=rose]{--top:#8E3A4A;--mid:#A14A58;--bot:#B9707A;--glow:rgba(255,220,225,.35)}
body[data-theme=night]{--top:#2E3E52;--mid:#4A5C70;--bot:#8EA0AE;--glow:rgba(220,230,255,.25)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:var(--sans);color:#fff;font-variant-numeric:lining-nums;
  background:linear-gradient(180deg,var(--top) 0%,var(--mid) 48%,var(--bot) 100%)}
.glow{position:absolute;inset:0;background:
  radial-gradient(700px 420px at 15% 82%,var(--glow),transparent 70%),
  radial-gradient(600px 500px at 90% 10%,rgba(255,255,255,.18),transparent 70%)}
.grain{position:absolute;inset:0;background-image:var(--noise);opacity:.55;mix-blend-mode:multiply}
.grain2{position:absolute;inset:0;background-image:var(--noise);opacity:.25;transform:scale(1.8);transform-origin:0 0}

/* 夜テーマの月と星 */
.moon{display:none;position:absolute;right:150px;top:70px;width:90px;height:90px;border-radius:50%;box-shadow:-22px 10px 0 0 #F3EEDF;transform:rotate(-20deg)}
body[data-theme=night] .moon{display:block}

/* REEL POST ラベル */
.lab{position:absolute;left:0;top:331px;width:1024px;height:70px}
.lab .ln{position:absolute;left:0;top:34px;width:512px;height:2px;background:#fff}
.lab .st{position:absolute;left:512px;top:0;width:70px;height:70px;padding:17px}
.lab .tx{position:absolute;right:0;top:-2px;font-family:var(--en);font-weight:500;font-size:67px;line-height:1;color:#fff}

/* 写真カード */
.card{position:absolute;left:57px;top:496px;width:967px;height:928px;border-radius:31px;overflow:hidden;background:rgba(255,255,255,.95)}
.card .ph{position:absolute;inset:0;background-size:cover;background-position:center 40%;opacity:.85}
.card .dk{position:absolute;inset:0;background:#000;opacity:.65}
.card .gr{display:none}
.card svg.fr{position:absolute;inset:0;width:100%;height:100%}

.kick{position:absolute;left:0;right:0;top:126px;text-align:center}
.kick span{display:inline-flex;align-items:center;height:97px;border:1.5px solid #fff;border-radius:999px;padding:0 36px 4px;font-size:63px;font-weight:500;letter-spacing:-.05em;color:#fff}
.ttl{position:absolute;left:0;right:0;top:253px;text-align:center;font-family:"Shippori Mincho",var(--serif);font-weight:500;font-size:133px;line-height:1.1;letter-spacing:-.08em;color:#fff}

/* プレーヤー */
.bar{position:absolute;left:54px;width:967px;top:1496px;height:2px;background:#fff}
.ctrl{position:absolute;left:271px;width:519px;top:1536px;height:49px;display:flex;justify-content:space-between;align-items:center}
.ctrl svg{width:40px;height:40px;fill:#fff;opacity:.9}
.ctrl svg.play{width:49px;height:49px}
body[data-theme=blue] .ctrl svg, body[data-theme=sage] .ctrl svg{opacity:.55}
</style>
</head>
<body>
<div class="glow"></div><div class="grain"></div><div class="grain2"></div><div class="moon"></div>

<div class="lab"><div class="ln"></div>
  <svg class="st" viewBox="-1 -1 2 2"><path d="M0,-1 C.08,-.08 .08,-.08 1,0 C.08,.08 .08,.08 0,1 C-.08,.08 -.08,.08 -1,0 C-.08,-.08 -.08,-.08 0,-1Z" fill="#fff"/></svg>
  <div class="tx">REEL POST</div></div>

<div class="card">
  <div class="ph" id="ph"></div><div class="dk"></div><div class="gr"></div>
  <!-- 角がへこんだ細い枠＋四隅の✦ -->
  <svg class="fr" viewBox="0 0 967 928" style="position:absolute;inset:0;width:967px;height:928px">
    <path d="M59,38 H900 A40,40 0 0 0 938,76 V852 A40,40 0 0 0 900,890 H59 A40,40 0 0 0 19,852 V76 A40,40 0 0 0 59,38 Z" fill="none" stroke="#fff" stroke-width="2" opacity=".78"/>
    <g fill="#fff">
      <path transform="translate(48,67) scale(13)" d="M0,-1 C.08,-.08 .08,-.08 1,0 C.08,.08 .08,.08 0,1 C-.08,.08 -.08,.08 -1,0 C-.08,-.08 -.08,-.08 0,-1Z"/>
      <path transform="translate(908,67) scale(13)" d="M0,-1 C.08,-.08 .08,-.08 1,0 C.08,.08 .08,.08 0,1 C-.08,.08 -.08,.08 -1,0 C-.08,-.08 -.08,-.08 0,-1Z"/>
      <path transform="translate(46,861) scale(13)" d="M0,-1 C.08,-.08 .08,-.08 1,0 C.08,.08 .08,.08 0,1 C-.08,.08 -.08,.08 -1,0 C-.08,-.08 -.08,-.08 0,-1Z"/>
      <path transform="translate(908,861) scale(13)" d="M0,-1 C.08,-.08 .08,-.08 1,0 C.08,.08 .08,.08 0,1 C-.08,.08 -.08,.08 -1,0 C-.08,-.08 -.08,-.08 0,-1Z"/>
    </g>
  </svg>
  <div class="kick"><span id="kick"></span></div>
  <div class="ttl" id="ttl"></div>
</div>

<div class="bar"></div>
<div class="ctrl">
  <svg viewBox="0 0 24 24"><path d="M17 1l4 4-4 4V6H7a3 3 0 0 0-3 3v2H2V9a5 5 0 0 1 5-5h10V1zM7 23l-4-4 4-4v3h10a3 3 0 0 0 3-3v-2h2v2a5 5 0 0 1-5 5H7v3z"/></svg>
  <svg viewBox="0 0 24 24"><path d="M5 4h2.5v16H5zM20 4v16L9 12z"/></svg>
  <svg class="play" viewBox="0 0 24 24"><path d="M6 3l15 9-15 9z"/></svg>
  <svg viewBox="0 0 24 24"><path d="M16.5 4H19v16h-2.5zM4 4l11 8-11 8z"/></svg>
  <svg viewBox="0 0 24 24"><path d="M16 3h5v5l-1.8-1.8-4.4 4.4-1.4-1.4 4.4-4.4zM3 17.6L16.6 4l1.4 1.4L4.4 19zM14.4 13l1.4-1.4 3.4 3.4L21 13.2V19h-5.8l1.8-1.8z"/></svg>
</div>

<script>
const q = new URLSearchParams(location.search);
document.body.dataset.theme = q.get('theme') || 'blue';
document.getElementById('ph').style.backgroundImage = `url("${q.get('photo') || 'photo.jpg'}")`;
document.getElementById('kick').textContent = q.get('kick') || 'フリーランスの落とし穴';
document.getElementById('ttl').innerHTML = (q.get('title') || '独立して|本当に困った|トラブル3選').split('|').join('<br>');
</script>
</body>
</html>
